name: Publish React Example App to GitHub Pages

on:
  push:
    branches: [main, react-demo-app]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            examples/react/package-lock.json

      - name: Install library dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Install example dependencies
        run: npm ci
        working-directory: examples/react

      - name: Build example app
        run: npm run build -- --base=/privy-near-connect/
        working-directory: examples/react
        env:
          VITE_PRIVY_APP_ID: ${{ vars.VITE_PRIVY_APP_ID }}
          VITE_PRIVY_APP_CLIENT_ID: ${{ vars.VITE_PRIVY_APP_CLIENT_ID }}

      - name: Set GitHub Pages sign page URL in manifest
        run: |
          node -e "const fs = require('node:fs'); const path = 'examples/react/dist/manifest.json'; const manifest = JSON.parse(fs.readFileSync(path, 'utf8')); const wallet = manifest.wallets?.find((entry) => entry.id === 'myprivywallet'); if (!wallet?.metadata) { throw new Error('myprivywallet metadata is missing from manifest.json'); } wallet.metadata.signPageURL = 'https://beneviolabs.github.io/privy-near-connect/#privy-sign'; fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');"

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: examples/react/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
