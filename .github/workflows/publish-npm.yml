name: Publish to npm

on:
  push:
    branches: [main, auto-publish-npm]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push version commits + create GitHub releases
      pull-requests: write  # open/update "Version Packages" PR
      id-token: write       # npm provenance OIDC attestation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Generate deploy token
        id: deploy-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - name: Configure git
        env:
          APP_TOKEN: ${{ steps.deploy-token.outputs.token }}
        run: |
          git config user.name "peerfolio-deploy-bot"
          git config user.email "peerfolio-deploy-bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${APP_TOKEN}@github.com/beneviolabs/privy-near-connect.git

      - name: Create Release PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
          setupGitUser: false
        env:
          GITHUB_TOKEN: ${{ steps.deploy-token.outputs.token }}

      - name: Update Release PR title with version
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ steps.deploy-token.outputs.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh pr edit "${{ steps.changesets.outputs.pullRequestNumber }}" --title "chore: release v${VERSION}"

      - name: Check for version bump
        id: version-bump
        run: |
          CURRENT=$(jq -r '.version' package.json)
          PREVIOUS=$(git show HEAD~1:package.json | jq -r '.version')
          if [ "$CURRENT" != "$PREVIOUS" ]; then
            echo "bumped=true" >> $GITHUB_OUTPUT
            echo "version=$CURRENT" >> $GITHUB_OUTPUT
          else
            echo "bumped=false" >> $GITHUB_OUTPUT
          fi

      - name: Notify Telegram — published to npm
        if: steps.version-bump.outputs.bumped == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *privy\-near\-connect* published to npm
            Version: `${{ steps.version-bump.outputs.version }}`
            https://www\.npmjs\.com/package/@peerfolio/privy\-near\-connect
