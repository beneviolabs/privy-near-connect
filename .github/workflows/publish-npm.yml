name: Publish to npm

on:
  push:
    branches: [main, auto-publish-npm]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push version commits + create GitHub releases
      pull-requests: write  # open/update "Version Packages" PR
      id-token: write       # npm provenance OIDC attestation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Generate deploy token
        id: deploy-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: npm run release
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
          setupGitUser: false

      - name: Update Release PR title with version
        if: steps.changesets.outputs.pullRequestNumber != ''
        env:
          GH_TOKEN: ${{ steps.deploy-token.outputs.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh pr edit "${{ steps.changesets.outputs.pullRequestNumber }}" --title "chore: release v${VERSION}"

      - name: Notify Telegram — published to npm
        if: steps.changesets.outputs.published == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          format: markdown
          message: |
            *privy\-near\-connect* published to npm
            Version: `${{ fromJson(steps.changesets.outputs.publishedPackages)[0].version }}`
            https://www\.npmjs\.com/package/@peerfolio/privy\-near\-connect
