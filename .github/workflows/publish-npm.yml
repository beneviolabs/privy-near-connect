name: privy-near-connect npm publisher

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Create PR or Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write       # push version commits + create GitHub releases
      pull-requests: write  # open/update "Version Packages" PR
      id-token: write       # npm provenance OIDC attestation

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 25
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - run: npm ci

      - name: Generate deploy token
        id: deploy-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.DEPLOY_APP_ID }}
          private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}

      - name: Configure git
        env:
          APP_TOKEN: ${{ steps.deploy-token.outputs.token }}
        run: |
          git config user.name "peerfolio-deploy-bot"
          git config user.email "peerfolio-deploy-bot@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${APP_TOKEN}@github.com/beneviolabs/privy-near-connect.git

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          github-token: ${{ steps.deploy-token.outputs.token }}
          publish-script: npm run release
          version-script: npm run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
        env:
          npm_config_provenance: "true"

      - name: Update Release PR title with version
        if: steps.changesets.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ steps.deploy-token.outputs.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh pr edit "${{ steps.changesets.outputs.pr-number }}" --title "chore: release @peerfolio/privy-near-connect v${VERSION}"

      - name: Read published version
        if: steps.changesets.outputs.published == 'true'
        id: published-version
        env:
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.published-packages }}
        run: |
          VERSION=$(node -e "const packages = JSON.parse(process.env.PUBLISHED_PACKAGES || '[]'); const pkg = packages.find((entry) => entry.name === '@peerfolio/privy-near-connect') ?? packages[0]; if (!pkg?.version) { throw new Error('Missing published package version'); } process.stdout.write(pkg.version);")
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build release notification
        id: msg
        if: steps.changesets.outputs.published == 'true'
        run: |
          VERSION="${{ steps.published-version.outputs.version }}"
          PR_NUMBER="${{ steps.changesets.outputs.pr-number }}"
          CHANGELOG=$(awk "/^## ${VERSION}$/{found=1;next} found && /^## /{exit} found{print}" CHANGELOG.md | sed '/^[[:space:]]*$/d')
          {
            echo "message<<EOF"
            echo "[privy-near-connect v${VERSION}](https://www.npmjs.com/package/@peerfolio/privy-near-connect/v/${VERSION}) published to npm"
            [ -n "$PR_NUMBER" ] && echo "PR: https://github.com/${{ github.repository }}/pull/${PR_NUMBER}"
            [ -n "$CHANGELOG" ] && echo "" && echo "${CHANGELOG}"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Notify Telegram — published to npm
        if: steps.changesets.outputs.published == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: ${{ steps.msg.outputs.message }}
